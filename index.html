<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KNF 장바구니 대여시스템</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KNF 장바구니 대여시스템">
<meta name="theme-color" content="#16323F">
<style>
  :root{
    --bg:#F3F4EF;
    --panel:#FFFFFF;
    --line:#DDE1D8;
    --ink:#1E2724;
    --sub:#6B7570;
    --navy:#16323F;
    --navy-2:#20465A;
    --gold:#C4902F;
    --gold-bg:#FBF2E2;
    --ok:#2F8F5B;
    --ok-bg:#E7F3EC;
    --rent:#C9622C;
    --rent-bg:#FBEBE1;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  input,textarea{user-select:text;-webkit-user-select:text;}
  html,body{margin:0;padding:0;background:#E4E6E0;height:100%;overflow:hidden;}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .app{
    background:var(--bg);
    color:var(--ink);
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  /* PC 등 넓은 화면: 폰처럼 중앙 정렬된 카드 형태로 표시 */
  @media (min-width: 620px){
    html,body{overflow:auto;}
    .app{
      height:min(900px, 96vh);
      margin:2vh auto;
      border-radius:20px;
      border:1px solid var(--line);
      box-shadow:0 12px 40px rgba(20,30,25,0.18);
    }
  }
  /* 관리자 모드: PC 화면에서는 표·데이터가 많으므로 폭을 넓게 사용 */
  @media (min-width: 620px){
    .app.admin-wide{ max-width:1100px; }
  }
  .header{
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;
    padding:20px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
  }
  .header .title{font-size:22px;font-weight:700;}
  .header .sub{font-size:13px;opacity:.75;margin-top:2px;font-weight:400;}
  .header .clock{font-variant-numeric:tabular-nums;font-size:15px;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:20px;}

  .screen{display:none;flex:1;min-height:0;padding:28px 32px;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .screen.active{display:flex;}

  /* -- 홈(대여/반납) -- */
  .empdisplay{
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:16px;
    text-align:center;
    margin-bottom:16px;
  }
  .empdisplay .label{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
  .empdisplay .digits{
    font-family:'SFMono-Regular',Consolas,monospace;
    font-size:30px;
    font-weight:700;
    letter-spacing:4px;
    color:var(--navy);
    min-height:38px;
  }
  .empdisplay .digits .cursor{opacity:.35;}

  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,minmax(0,100px));
    align-content:center;
    gap:8px;
    flex:1;
    min-height:0;
  }
  .key{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    font-size:28px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .12s ease, transform .1s ease;
    min-height:0;
    max-height:100px;
  }
  .key:active{background:var(--ok-bg);transform:scale(.96);}
  .key.clear{color:var(--rent);font-size:16px;font-weight:700;}
  .key.clear:active{background:var(--rent-bg);}

  .actionrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;flex-shrink:0;}
  .actbtn{
    padding:18px;border:none;border-radius:14px;font-weight:700;font-size:18px;cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  .actbtn:active{transform:scale(.97);}
  .actbtn.rentbtn{background:var(--navy);color:#fff;}
  .actbtn.returnbtn{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}

  .msg{min-height:44px;margin-top:14px;font-size:13.5px;font-weight:600;line-height:1.5;text-align:center;padding:0 6px;}
  .msg.ok{color:var(--ok);}
  .msg.rent{color:var(--rent);}
  .msg.err{color:#B0473B;}
  .msg.reward{color:var(--gold);}

  /* -- 홈 3단계 플로우 -- */
  .homestep{display:none;flex:1;flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .homestep.active{display:flex;}
  .bigbtnrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;flex:1;}
  .bigbtn{
    border:none;border-radius:20px;font-weight:700;font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    transition:transform .1s ease, opacity .15s ease;
    padding:12px 4px;box-shadow:none;-webkit-appearance:none;appearance:none;
    word-break:keep-all;white-space:normal;line-height:1.25;
  }
  .bigbtn:active{transform:scale(.97);}
  .bigbtn .bigicon{font-size:42px;box-shadow:none;filter:none;}
  .bigbtn .bigicon svg{display:block;filter:none;width:42px;height:42px;}
  .bigbtn.rentbig{background:#fff;color:var(--navy);border:2px solid var(--navy);}
  .bigbtn.returnbig{background:#fff;color:var(--navy);border:2px solid var(--navy);}
  .bigbtn.reportbig{background:#fff;color:#B0473B;border:2px solid #B0473B;font-size:18px;}

  .stepTitle{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;text-align:center;}
  /* .app는 항상 최대 480px 폭의 카드로 렌더링되므로(태블릿 가로모드에서도 동일),
     아래 필드박스 스타일은 뷰포트 폭이 아니라 이 고정폭 카드 기준으로 항상 적용됩니다. */
  .fieldbox{
    background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
    padding:10px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s ease;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  }
  .fieldbox.static{cursor:default;}
  .fieldbox.focused{border-color:var(--gold);}
  .fieldbox .label{font-size:16px;color:var(--sub);font-weight:700;flex-shrink:0;white-space:nowrap;}
  .fieldbox .digits{
    font-family:'SFMono-Regular',Consolas,monospace;font-size:22px;font-weight:700;
    color:var(--navy);min-height:28px;text-align:left;width:100%;
  }
  .fieldbox .digits .cursor{opacity:.35;}
  .fieldbox .periodrow{flex:0 0 auto;width:100%;margin-bottom:0;}

  .fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fieldrow .fieldbox{margin-bottom:0;}

  @media (max-width: 560px){
    .fieldrow{grid-template-columns:1fr;}
  }

  @media (max-width: 360px){
    .fieldbox .label{font-size:15px;}
    .fieldbox .digits{font-size:20px;}
    .keypad{gap:6px;}
    .key{font-size:22px;}
  }

  .resultbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;}
  .resultIcon{font-size:60px;}
  .resultTitle{font-size:22px;font-weight:700;}
  .resultTitle.success{color:var(--ok);}
  .resultTitle.fail{color:#B0473B;}
  .resultMsg{font-size:16px;color:var(--sub);line-height:1.6;padding:0 10px;}

  /* -- 재고관리(입출고 현황) -- */
  h3.sect{font-size:14px;color:var(--sub);font-weight:700;letter-spacing:.5px;margin:0 0 14px 0;text-transform:uppercase;}
  .stockcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stockcards.admin4{grid-template-columns:repeat(4,1fr);}
  .stockcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 10px;text-align:center;transition:border-color .15s ease, transform .1s ease;}
  .stockcard.clickable{cursor:pointer;}
  .stockcard.clickable:active{transform:scale(.96);}
  .stockcard.clickable:hover{border-color:var(--gold);}
  .stockcard .num{font-family:'SFMono-Regular',Consolas,monospace;font-size:30px;font-weight:700;color:var(--navy);}
  .stockcard.total .num{color:var(--navy);}
  .stockcard.instock .num{color:var(--ok);}
  .stockcard.outstock .num{color:var(--rent);}
  .stockcard.disposed .num{color:#8B5CF6;}
  .stockcard .clabel{font-size:12px;color:var(--sub);margin-top:5px;}
  .stockcards.admin4 .stockcard{padding:14px 6px;}
  .stockcards.admin4 .stockcard .num{font-size:24px;}
  .stockcards.admin4 .stockcard .clabel{font-size:11px;}
  .invtable-wrap{flex:1;overflow-y:auto;overflow-x:auto;}
  .invtable-wrap.no-hscroll{overflow-x:hidden;}
  .invtable-wrap.full{flex:none;overflow-y:visible;max-height:none;}
  .invtable{width:100%;min-width:640px;border-collapse:collapse;font-size:14px;}
  .invtable.compact{min-width:0;table-layout:fixed;font-size:13px;}
  .invtable.compact th,.invtable.compact td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 4px;}
  .invtable.compact th:first-child,.invtable.compact td:first-child{padding-left:2px;}
  .invtable.compact th:last-child,.invtable.compact td:last-child{padding-right:2px;}
  .invtable.compact th:nth-child(1),.invtable.compact td:nth-child(1){width:17%;}
  .invtable.compact th:nth-child(2),.invtable.compact td:nth-child(2){width:27%;}
  .invtable.compact th:nth-child(3),.invtable.compact td:nth-child(3){width:15%;}
  .invtable.compact th:nth-child(4),.invtable.compact td:nth-child(4){width:22%;}
  .invtable.compact th:nth-child(5),.invtable.compact td:nth-child(5){width:19%;}
  .invtable th{text-align:left;color:var(--sub);font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);font-size:12.5px;position:sticky;top:0;background:var(--bg);}
  .invtable td{padding:10px 8px;border-bottom:1px solid #EEF0EA;}
  #userMileageSection{display:flex;flex-direction:column;}
  .basket-link{color:var(--navy);font-weight:700;text-decoration:underline;cursor:pointer;}
  .iotag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;}
  .iotag.in{background:var(--ok-bg);color:var(--ok);}
  .iotag.out{background:var(--rent-bg);color:var(--rent);}
  .iotag.dispose{background:#EFE9FE;color:#8B5CF6;}
  .invempty{color:var(--sub);text-align:center;padding:20px 8px;font-size:14px;}
  .del-staff-btn{
    background:none;border:1px solid #E3B3AA;color:#B0473B;
    padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }
  .del-staff-btn:hover{background:#FBEBE1;}
  .danger-btn{
    width:100%;background:#fff;border:1.5px solid var(--rent);color:var(--rent);
    padding:11px 12px;border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .danger-btn:active{background:var(--rent-bg);}
  .mini-btn{
    background:none;border:1px solid var(--navy);color:var(--navy);
    padding:5px 10px;border-radius:14px;font-size:12px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }
  .mini-btn:hover{background:#EEF1F6;}
  .lookup-btn{
    width:100%;background:#fff;border:1.5px solid var(--navy);color:var(--navy);
    padding:14px 12px;margin-bottom:11px;border-radius:12px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;transition:background .12s ease, transform .1s ease;
  }
  .lookup-btn:active{background:#EEF1F6;transform:scale(.98);}
  .qr-lookup-row{
    display:flex;flex-direction:column;gap:4px;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    margin-bottom:8px;cursor:pointer;font-size:14px;background:var(--panel);
  }
  .qr-lookup-row:hover{border-color:var(--gold);}
  .qr-lookup-row .qlr-top{display:flex;justify-content:space-between;align-items:center;width:100%;}
  .qr-lookup-row .qlr-name{font-weight:700;color:var(--navy);}
  .qr-lookup-row .qlr-basket{color:var(--rent);font-weight:700;}
  .qr-lookup-row .qlr-time{font-size:12px;color:var(--sub);}
  .qr-lookup-empty{color:var(--sub);font-size:13px;padding:8px 0;}
  .stockactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .stockactions .actbtn{padding:16px;font-size:16px;color:#fff;border:none;}
  .instockbtn{background:var(--ok);}
  .outstockbtn{background:var(--rent);}

  /* -- 실적 -- */
  .board-table{width:100%;border-collapse:collapse;font-size:16px;}
  .board-table th{text-align:left;color:var(--sub);font-weight:600;padding:11px 8px;border-bottom:1px solid var(--line);font-size:13px;}
  .board-table td{padding:13px 8px;border-bottom:1px solid #EEF0EA;}
  .rank{font-weight:700;color:var(--navy);width:28px;}
  .badge{display:inline-block;background:var(--gold-bg);color:var(--gold);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:10px;}
  .periodrow{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .periodbtn{
    flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--panel);
    border-radius:20px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;
    min-width:70px;
  }
  .periodbtn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  /* -- 하단 탭바 -- */
  .tabbar{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    border-top:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tab{
    padding:15px 6px;
    text-align:center;
    font-size:14px;
    color:var(--sub);
    cursor:pointer;
    font-weight:600;
    border-top:2.5px solid transparent;
  }
  .tab .icon{font-size:23px;display:block;margin-bottom:4px;}
  .tab.active{color:var(--navy);border-top-color:var(--gold);}
  .resetlink{
    text-align:center;font-size:12px;color:var(--sub);
    padding:6px 0 2px 0;text-decoration:underline;cursor:pointer;
  }

  /* -- 관리자 모드 -- */
  .headerRight{display:flex;align-items:center;gap:10px;}
  .adminbtn{
    display:flex;align-items:center;gap:5px;
    background:rgba(255,255,255,.14);
    color:#fff;
    border:none;
    font-size:13px;
    font-weight:700;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .adminbtn.on{background:var(--gold);color:#20180a;}
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(15,20,18,.5);
    align-items:center;justify-content:center;
    z-index:60;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--panel);
    border-radius:18px;
    padding:26px 22px;
    width:min(320px,100%);
    text-align:center;
  }
  .modal-card.wide{width:min(480px,100%);text-align:left;max-height:80vh;display:flex;flex-direction:column;}
  .modal-card.wide .modal-title{text-align:left;}
  .modal-title{font-size:17px;font-weight:700;color:var(--ink);}
  .modal-sub{font-size:13px;color:var(--sub);margin-top:4px;}
  .pindots{display:flex;gap:12px;justify-content:center;margin:18px 0 6px 0;}
  .pindot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:transparent;transition:background .12s ease;}
  .pindot.filled{background:var(--navy);border-color:var(--navy);}
  .modal-msg{min-height:18px;font-size:13px;color:#B0473B;font-weight:600;margin-bottom:8px;}
  .modal-actions{margin-top:14px;display:flex;gap:10px;justify-content:center;}
  .modal-cancel{
    background:none;border:1px solid var(--line);color:var(--sub);
    padding:9px 20px;border-radius:20px;font-size:14px;cursor:pointer;
  }
  .modal-confirm{
    background:var(--navy);border:none;color:#fff;
    padding:9px 22px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .modal-msg-body{font-size:15px;color:var(--ink);margin-top:6px;line-height:1.5;}
  .modal-field{text-align:left;margin-top:14px;}
  .modal-field label{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:5px;}
  .modal-field input{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;
    font-family:inherit;
  }
  .modal-field input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .shake{animation:shakeAnim .35s;}
  @keyframes shakeAnim{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;overflow:hidden;">
      <svg width="38" height="38" viewBox="0 0 100 100" style="flex-shrink:0;" aria-hidden="true" focusable="false">
        <path d="M28,42 L72,42 L67,88 L33,88 Z" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
        <path d="M34,42 C34,26 66,26 66,42" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
        <path d="M50,32 C50,20 32,17 30,28 C28,38 46,42 50,32 Z" fill="#FFFFFF"/>
        <path d="M50,32 C50,20 68,17 70,28 C72,38 54,42 50,32 Z" fill="#FFFFFF"/>
        <circle cx="50" cy="32" r="6" fill="#C4902F"/>
      </svg>
      <div style="min-width:0;flex:1;">
        <div class="title">KNF 장바구니 대여시스템</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;">
          <div class="sub" style="margin-top:0;min-width:0;flex:1;">※ 이용 문의사항은 ESG협력부(☎1143)로 연락주시기 바랍니다.</div>
          
        </div>
      </div>
    </div>
  </div>

  <!-- 홈 -->
  <div class="screen active" id="screen-home">

    <!-- 1단계: 대여/반납 선택 -->
    <div class="homestep active" id="step-buttons">
      <div class="bigbtnrow">
        <button class="bigbtn rentbig" id="goRentBtn"><span class="bigicon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></span>대여</button>
        <button class="bigbtn returnbig" id="goReturnBtn"><span class="bigicon" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg></span>반납</button>

<script>
(function(){
  const TOTAL = 300;
  const REWARD_EVERY = 10;
  const MAX_DIGITS = 6;
  const STORE_KEY = 'knf-basket-rental-program-v1'; // 이 브라우저(태블릿) 로컬에만 저장됨 - 완전 오프라인 동작

  const userLookupEmpInput = document.getElementById('userLookupEmpInput');
  const userDateStartInput = document.getElementById('userDateStartInput');
  const userDateEndInput = document.getElementById('userDateEndInput');
  const userLookupBtn = document.getElementById('userLookupBtn');
  const userLookupMsg = document.getElementById('userLookupMsg');
  const userLookupResetBtn = document.getElementById('userLookupResetBtn');
  const userMileageSection = document.getElementById('userMileageSection');
  const userMileageEarned = document.getElementById('userMileageEarned');
  const userRentingList = document.getElementById('userRentingList');
  let userLookupEmpId = null;
  let userDateStart = null;
  let userDateEnd = null;

  function localDateStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function userDateRangeDefaults(){
    const now = new Date();
    userDateStartInput.value = now.getFullYear() + '-01-01';
    userDateEndInput.value = localDateStr(now);
  }
  userDateRangeDefaults();
  const stepButtons = document.getElementById('step-buttons');
  const stepInput = document.getElementById('step-input');
  const stepResult = document.getElementById('step-result');
  const goRentBtn = document.getElementById('goRentBtn');
  const goReturnBtn = document.getElementById('goReturnBtn');
  const goReportBtn = document.getElementById('goReportBtn');
  const reportReasonGroup = document.getElementById('reportReasonGroup');
  const reportReasonRow = document.getElementById('reportReasonRow');
  const stepInputTitle = document.getElementById('stepInputTitle');
  const basketBox = document.getElementById('basketBox');
  const basketDigitsDisplay = document.getElementById('basketDigitsDisplay');
  const basketConfirmedText = document.getElementById('basketConfirmedText');
  const basketConfirmedNum = document.getElementById('basketConfirmedNum');
  const empBox = document.getElementById('empBox');
  const empDigitsDisplay = document.getElementById('empDigitsDisplay');
  const empLookupOpenBtn = document.getElementById('empLookupOpenBtn');
  const empLookupModal = document.getElementById('empLookupModal');
  const empLookupInput = document.getElementById('empLookupInput');
  const empLookupSearchBtn = document.getElementById('empLookupSearchBtn');
  const empLookupResults = document.getElementById('empLookupResults');
  const empLookupCancelBtn = document.getElementById('empLookupCancelBtn');
  const keypad = document.getElementById('keypad');
  const inputBackBtn = document.getElementById('inputBackBtn');
  const inputNextBtn = document.getElementById('inputNextBtn');
  const resultIcon = document.getElementById('resultIcon');
  const resultTitle = document.getElementById('resultTitle');
  const resultMsg = document.getElementById('resultMsg');
  const resultDoneBtn = document.getElementById('resultDoneBtn');
  const tabs = document.querySelectorAll('.tab');
  const screens = document.querySelectorAll('.screen');
  const tabbar = document.getElementById('tabbar');
  const actionModal = document.getElementById('actionModal');
  const actionModalTitle = document.getElementById('actionModalTitle');
  const actionModalMsg = document.getElementById('actionModalMsg');
  const actionModalButtons = document.getElementById('actionModalButtons');

  const EMP_MAX = 6;
  const BASKET_MAX = 4; // 최대 4자리(최대 9999개까지 대응 - 관리자 등록 범위와 여유있게 일치)
  const OVERDUE_MS = 7 * 24 * 60 * 60 * 1000; // 장기 미반납 기준: 7일(168시간) 초과
  let flowMode = null;      // '대여' | '반납' | '훼손분실'
  let inputPhase = 'basket'; // 대여/반납/훼손분실 직접입력 흐름 전용: 'basket' -> 'emp'
  let activeField = 'emp';  // 'emp' | 'basket'
  let empDigits = '';
  let basketDigits = '';
  let reportReason = '훼손'; // '훼손' | '분실'
  let lastState = null;

  function defaultState(){
    const baskets = [];
    for(let i=1;i<=TOTAL;i++) baskets.push({ id:i, status:'available', employeeId:null, rentedAt:null });
    return { baskets, users:{}, log: [], employees:{} };
  }

  // ==== Firestore 문서 4개로 분리 (재고/직원/이력/실적) ====
  // 문서 1개에 다 담던 이전 방식과 달리, 카테고리별로 별도 문서 + 별도 보안규칙 적용 가능
  const FB_COL = fbDb.collection('eumbottari');
  const FB_BASKETS = FB_COL.doc('baskets');
  const FB_EMPLOYEES = FB_COL.doc('employees');
  const FB_LOG = FB_COL.doc('log');
  const FB_USERSTATS = FB_COL.doc('userStats');
  const LOG_MAX_KEEP = 2000; // 문서 크기 제한(1MB) 대비, 오래된 로그는 자동으로 정리

  async function loadState(){
    try{
      const [basketsSnap, employeesSnap, logSnap, usersSnap] = await Promise.all([
        FB_BASKETS.get(), FB_EMPLOYEES.get(), FB_LOG.get(), FB_USERSTATS.get()
      ]);
      if(!basketsSnap.exists){
        // 최초 실행: 기본 데이터 생성 후 4개 문서로 저장
        const init = defaultState();
        await saveState(init);
        return init;
      }
      return {
        baskets: basketsSnap.data().baskets || [],
        employees: employeesSnap.exists ? (employeesSnap.data().employees || {}) : {},
        log: logSnap.exists ? (logSnap.data().log || []) : [],
        users: usersSnap.exists ? (usersSnap.data().users || {}) : {}
      };
    }catch(e){
      console.error('불러오기 실패(Firebase)', e);
      return defaultState();
    }
  }

  async function saveState(state){
    try{
      const batch = fbDb.batch();
      batch.set(FB_BASKETS, { baskets: state.baskets });
      batch.set(FB_EMPLOYEES, { employees: state.employees });
      batch.set(FB_LOG, { log: state.log.slice(0, LOG_MAX_KEEP) });
      batch.set(FB_USERSTATS, { users: state.users });
      await batch.commit();
      return true;
    }catch(e){
      console.error('저장 실패(Firebase)', e);
      const code = e && e.code ? e.code : '';
      let detail = '네트워크 연결을 확인해 주세요.';
      if(code === 'permission-denied'){
        detail = '서버 저장 권한이 거부되었습니다. (Firestore 보안 규칙을 확인해 주세요)';
      } else if(code === 'unavailable'){
        detail = '서버에 연결할 수 없습니다. 네트워크(와이파이) 연결을 확인해 주세요.';
      } else if(code){
        detail = `오류 코드: ${code}. 네트워크 연결을 확인한 뒤 다시 시도해 주세요.`;
      }
      showAlert('저장 실패', `서버에 저장하지 못했습니다. ${detail} 방금 하신 처리는 반영되지 않았으니 다시 시도해 주세요.`);
      return false;
    }
  }

  // 실시간 동기화: 4개 문서 중 하나라도 바뀌면 자동으로 화면 갱신
  const fbLatest = { baskets: null, employees: null, log: null, users: null };
  function tryRenderFromLatest(){
    if(fbLatest.baskets && fbLatest.employees && fbLatest.log && fbLatest.users){
      render({ baskets: fbLatest.baskets, employees: fbLatest.employees, log: fbLatest.log, users: fbLatest.users });
    }
  }
  FB_BASKETS.onSnapshot((snap) => {
    if(!snap.exists) return;
    fbLatest.baskets = snap.data().baskets || [];
    tryRenderFromLatest();
  }, (err) => console.error('실시간 동기화 오류(baskets)', err));
  FB_EMPLOYEES.onSnapshot((snap) => {
    fbLatest.employees = snap.exists ? (snap.data().employees || {}) : {};
    tryRenderFromLatest();
  }, (err) => console.error('실시간 동기화 오류(employees)', err));
  FB_LOG.onSnapshot((snap) => {
    fbLatest.log = snap.exists ? (snap.data().log || []) : [];
    tryRenderFromLatest();
  }, (err) => console.error('실시간 동기화 오류(log)', err));
  FB_USERSTATS.onSnapshot((snap) => {
    fbLatest.users = snap.exists ? (snap.data().users || {}) : {};
    tryRenderFromLatest();
  }, (err) => console.error('실시간 동기화 오류(userStats)', err));
  function fmtTime(d){ return d.toLocaleTimeString('ko-KR', { hour12:false }); }
  function fmtRentedAt(iso){
    if(!iso) return '-';
    const dateStr = iso.slice(0,10);
    const timeStr = new Date(iso).toLocaleTimeString('ko-KR', { hour12:false });
    return `${dateStr} ${timeStr}`;
  }
  function maskId(id){
    return id; // 사번 전체공개
  }
  function empLabel(state, empId){
    // 개인정보 보호를 위해 성명은 표시하지 않고 사번만 표시합니다.
    if(!empId) return '-';
    return maskId(empId);
  }

  function padBasket(n){ return String(n).padStart(4,'0'); }
  function isDisposeAction(action){ return action === '폐기/분실' || action === '출고'; }
  function classifyLogRow(l){
    if(l.type === 'adjust'){
      if(isDisposeAction(l.action)) return { cls:'dispose', label:'폐기/분실' };
      if(l.action === '수동변경') return { cls: l.manualTo === 'rented' ? 'out' : 'in', label:'수동변경' };
      return { cls:'in', label:'입고' };
    }
    return l.action === '대여' ? { cls:'out', label:'출고' } : { cls:'in', label:'입고' };
  }

  function renderFields(){
    empDigitsDisplay.innerHTML = empDigits.length
      ? empDigits + '<span class="cursor">|</span>'
      : '입력하세요<span class="cursor">|</span>';
    basketDigitsDisplay.innerHTML = basketDigits.length
      ? basketDigits + '<span class="cursor">|</span>'
      : '입력하세요<span class="cursor">|</span>';
  }

  function updateFieldFocus(){
    empBox.classList.toggle('focused', activeField === 'emp');
    basketBox.classList.toggle('focused', activeField === 'basket');
  }

  empBox.addEventListener('click', () => { activeField = 'emp'; updateFieldFocus(); });
  basketBox.addEventListener('click', () => { activeField = 'basket'; updateFieldFocus(); });

  // 키패드 구성 (활성 필드에 따라 사번/장바구니 번호 중 하나에 입력)
  const keys = ['1','2','3','4','5','6','7','8','9','지움','0','←'];
  keys.forEach(k => {
    const el = document.createElement('div');
    el.className = 'key' + (k === '지움' ? ' clear' : '');
    el.textContent = k;
    el.addEventListener('click', () => {
      if(activeField === 'basket'){
        if(k === '지움'){
          basketDigits = '';
        } else if(k === '←'){
          basketDigits = basketDigits.slice(0,-1);
        } else {
          if(basketDigits.length < BASKET_MAX) basketDigits += k;
        }
      } else {
        if(k === '지움'){
          empDigits = '';
        } else if(k === '←'){
          empDigits = empDigits.slice(0,-1);
        } else {
          if(empDigits.length < EMP_MAX) empDigits += k;
        }
      }
      renderFields();
    });
    keypad.appendChild(el);
  });

  function showHomeStep(name){
    document.querySelectorAll('.homestep').forEach(s => s.classList.remove('active'));
    document.getElementById('step-' + name).classList.add('active');
  }

  function resetInputFields(){
    empDigits = ''; basketDigits = ''; activeField = 'emp'; inputPhase = 'basket';
    basketBox.style.display = 'none';
    basketConfirmedText.style.display = 'none';
    empBox.style.display = 'none';
    empLookupOpenBtn.style.display = 'none';
    updateFieldFocus(); renderFields();
  }

  // 장바구니 번호 입력 완료 후 사번 입력 단계로 넘어갈 때: 입력창 대신 확정된 번호를 텍스트로 표시
  function confirmBasketNumber(basketNum){
    basketBox.style.display = 'none';
    basketConfirmedNum.textContent = padBasket(basketNum) + '번';
    basketConfirmedText.style.display = '';
  }

  function render(state){
    // 대여현황 화면 (사용자 모드) - 사번 조회 후에만 표시
    if(!userLookupEmpId){
      userMileageSection.style.display = 'none';
    } else {
      userMileageSection.style.display = '';

      // 조회 기간(시작일~종료일) 내 로그만 대상으로 함 - "대여 중" 현황은 기간과 무관하게 현재 상태 그대로
      const withinDateRange = (l) => {
        if(!l.at || !userDateStart || !userDateEnd) return true;
        const d = new Date(l.at);
        return d >= userDateStart && d <= userDateEnd;
      };

      // 마일리지: 적립만 존재 (차감 개념 없음) - 조회 기간 내 대여/반납으로 적립된 점수 합계
      const mileageLog = state.log.filter(l => l.type !== 'adjust' && l.type !== 'mileageRedeem' && l.employeeId === userLookupEmpId && withinDateRange(l));
      const earned = mileageLog.reduce((sum, l) => sum + (l.points != null ? l.points : 0), 0);
      userMileageEarned.textContent = earned;

      // 현재 대여 중인 장바구니 (기간 필터와 무관한 실시간 상태)
      const rentingBaskets = state.baskets
        .filter(b => b.status === 'rented' && b.employeeId === userLookupEmpId)
        .sort((a,b) => a.id - b.id);
      userRentingList.textContent = rentingBaskets.length === 0
        ? '없음'
        : rentingBaskets.map(b => padBasket(b.id) + '번').join(', ');
    }

    lastState = state;
  }

  // ---- 대여현황 화면: 사번으로 내 이력·마일리지 조회 ----
  function doUserLookup(){
    const empId = userLookupEmpInput.value.trim();
    if(!isValidEmpId(empId)){
      userLookupMsg.textContent = '사번 6자리 숫자를 정확히 입력해 주세요.';
      return;
    }
    const startVal = userDateStartInput.value;
    const endVal = userDateEndInput.value;
    if(!startVal || !endVal){
      userLookupMsg.textContent = '조회 기간(시작일/종료일)을 입력해 주세요.';
      return;
    }
    const start = new Date(startVal + 'T00:00:00');
    const end = new Date(endVal + 'T23:59:59');
    if(start > end){
      userLookupMsg.textContent = '시작일은 종료일보다 이후일 수 없습니다.';
      return;
    }
    userLookupEmpId = empId;
    userDateStart = start;
    userDateEnd = end;
    userLookupMsg.textContent = '';
    if(lastState) render(lastState);
  }
  userLookupBtn.addEventListener('click', doUserLookup);
  userLookupEmpInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') doUserLookup();
  });
  userLookupEmpInput.addEventListener('input', () => {
    userLookupEmpInput.value = userLookupEmpInput.value.replace(/\D/g,'').slice(0,6);
  });
  userLookupResetBtn.addEventListener('click', () => {
    userLookupEmpId = null;
    userDateStart = null;
    userDateEnd = null;
    userLookupEmpInput.value = '';
    userDateRangeDefaults();
    userLookupMsg.textContent = '';
    if(lastState) render(lastState);
  });

  const RENT_POINT = 1; // 대여 시 건당 1점

  // 반납 점수: 대여~반납 경과시간(분) 기준
  //  1시간 이내: 0점 / 1시간초과~24시간이내: 3점 / 24시간초과~5일이내: 2점 / 5일 초과: 1점
  function calcReturnPoints(mins){
    if(mins <= 60) return 0;
    if(mins <= 1440) return 3;
    if(mins <= 7200) return 2;
    return 1;
  }

  // ---- 훼손/분실 신고 전용: 대여자 사번으로 장바구니 조회 (QR 스캔 대체) ----
  function searchRentedBasketsByQuery(state, query){
    const q = query.trim();
    if(!/^\d{6}$/.test(q)) return [];
    return state.baskets.filter(b => b.status === 'rented' && b.employeeId === q);
  }

  empLookupOpenBtn.addEventListener('click', () => {
    empLookupInput.value = '';
    empLookupResults.innerHTML = '';
    empLookupModal.classList.add('show');
    setTimeout(() => empLookupInput.focus(), 50);
  });

  empLookupCancelBtn.addEventListener('click', () => {
    empLookupModal.classList.remove('show');
  });

  empLookupSearchBtn.addEventListener('click', async () => {
    const query = empLookupInput.value;
    if(!/^\d{6}$/.test(query.trim())){
      empLookupResults.innerHTML = '<div class="qr-lookup-empty">사번 6자리를 입력해 주세요.</div>';
      return;
    }
    const state = await loadState();
    const matches = searchRentedBasketsByQuery(state, query);

    if(matches.length === 0){
      empLookupResults.innerHTML = '<div class="qr-lookup-empty">일치하는 대여 중인 장바구니가 없습니다.</div>';
      return;
    }
    empLookupResults.innerHTML = matches.map(b => {
      return `<div class="qr-lookup-row" data-basket="${b.id}">
        <div class="qlr-top">
          <span class="qlr-basket">장바구니 ${padBasket(b.id)}번</span>
        </div>
      </div>`;
    }).join('');
    Array.from(empLookupResults.querySelectorAll('.qr-lookup-row')).forEach(row => {
      row.addEventListener('click', () => {
        basketDigits = row.dataset.basket;
        renderFields();
        empLookupModal.classList.remove('show');
      });
    });
  });

  function proceedAfterEmpConfirmed(){
    processFlow();
  }

  function showResult(success, message){
    resultIcon.textContent = success ? '✅' : '⚠️';
    resultTitle.textContent = success ? '처리 완료' : '처리 실패';
    resultTitle.className = 'resultTitle ' + (success ? 'success' : 'fail');
    resultMsg.textContent = message;
    showHomeStep('result');
  }

  async function processFlow(){
    const state = await loadState();
    const basketNum = parseInt(basketDigits, 10);
    const basket = state.baskets.find(b => b.id === basketNum);
    const now = new Date();

    if(!basket){
      showAlert('처리 실패', `존재하지 않는 장바구니 번호(${padBasket(basketNum)}번)입니다.`);
      return;
    }

    if(flowMode === '대여'){
      if(basket.status === 'rented'){
        showAlert('처리 실패', `장바구니 ${padBasket(basketNum)}번은 이미 대여 중입니다.`);
        return;
      }
      basket.status = 'rented'; basket.employeeId = empDigits; basket.rentedAt = now.toISOString();

      if(!state.users[empDigits]) state.users[empDigits] = { rentCount:0, returnCount:0 };
      state.users[empDigits].rentCount += 1;

      const remainAfter = state.baskets.filter(b => b.status === 'available').length;
      state.log.unshift({ time: fmtTime(now), at: now.toISOString(), employeeId: empDigits, action:'대여', basketId: basketNum, remain: remainAfter, points: RENT_POINT });
      if(!(await saveState(state))) return;
      render(state);
      showResult(true, `사번 ${empDigits} · 장바구니 ${padBasket(basketNum)}번이 대여되었습니다.`);
    } else if(flowMode === '반납'){
      if(basket.status === 'available'){
        showAlert('처리 실패', `장바구니 ${padBasket(basketNum)}번은 대여 중이 아닙니다.`);
        return;
      }
      const rentedAt = basket.rentedAt ? new Date(basket.rentedAt) : now;
      const mins = Math.max(1, Math.round((now - rentedAt) / 60000));
      const returnPoints = calcReturnPoints(mins);
      basket.status = 'available'; basket.employeeId = null; basket.rentedAt = null;

      if(!state.users[empDigits]) state.users[empDigits] = { rentCount:0, returnCount:0 };
      state.users[empDigits].returnCount += 1;
      const newCount = state.users[empDigits].returnCount;

      const remainAfter = state.baskets.filter(b => b.status === 'available').length;
      state.log.unshift({ time: fmtTime(now), at: now.toISOString(), employeeId: empDigits, action:'반납', basketId: basketNum, remain: remainAfter, points: returnPoints });
      if(!(await saveState(state))) return;
      render(state);

      let extra = '';
      if(newCount % REWARD_EVERY === 0){
        extra = ` 누적 반납 ${newCount}회 달성 — 마일리지 지급대상입니다! 🎁`;
      }
      showResult(true, `사번 ${empDigits} · 장바구니 ${padBasket(basketNum)}번이 반납되었습니다. (이용시간 약 ${mins}분, ${returnPoints}점 적립)${extra}`);
    } else {
      // 훼손/분실 신고 - 대여 중인 장바구니만 신고 가능
      if(basket.status !== 'rented'){
        showAlert('처리 실패', `장바구니 ${padBasket(basketNum)}번은 대여 중이 아니라 신고할 수 없습니다. 대여 중인 장바구니만 훼손/분실 신고가 가능합니다.`);
        return;
      }
      state.baskets = state.baskets.filter(b => b.id !== basketNum);
      const remainAfter = state.baskets.filter(b => b.status === 'available').length;
      const logEntry = {
        time: fmtTime(now), at: now.toISOString(), type:'adjust', action:'폐기/분실',
        qty:1, reason: `${reportReason} 신고`, employeeId: empDigits, basketId: basketNum, remain: remainAfter
      };
      state.log.unshift(logEntry);
      if(!(await saveState(state))) return;
      render(state);
      const reportTail = reportReason === '훼손'
        ? '훼손된 장바구니는 신고자께서 자체 처리해 주시기 바랍니다. 별도로 반납하지 않으셔도 됩니다.'
        : '';
      showResult(true, `장바구니 ${padBasket(basketNum)}번이 ${reportReason}(으)로 접수되었습니다. 신고해 주셔서 감사합니다.${reportTail ? ' ' + reportTail : ''}`);
    }
  }

  function isValidEmpId(id){
    return /^\d{6}$/.test(id);
  }

  function closeActionModal(){
    actionModal.classList.remove('show');
    actionModalButtons.innerHTML = '';
  }

  function showAlert(title, message){
    actionModalTitle.textContent = title;
    actionModalMsg.textContent = message;
    actionModalButtons.innerHTML = '';
    const okBtn = document.createElement('button');
    okBtn.className = 'modal-confirm';
    okBtn.textContent = '확인';
    okBtn.addEventListener('click', closeActionModal);
    actionModalButtons.appendChild(okBtn);
    actionModal.classList.add('show');
  }

  function showConfirm(title, message, onConfirm){
    actionModalTitle.textContent = title;
    actionModalMsg.textContent = message;
    actionModalButtons.innerHTML = '';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'modal-cancel';
    cancelBtn.textContent = '취소';
    cancelBtn.addEventListener('click', closeActionModal);
    const okBtn = document.createElement('button');
    okBtn.className = 'modal-confirm';
    okBtn.textContent = '확인';
    okBtn.addEventListener('click', () => { closeActionModal(); onConfirm(); });
    actionModalButtons.appendChild(cancelBtn);
    actionModalButtons.appendChild(okBtn);
    actionModal.classList.add('show');
  }

  function showYesNo(title, message, yesLabel, noLabel, onYes, onNo){
    actionModalTitle.textContent = title;
    actionModalMsg.textContent = message;
    actionModalButtons.innerHTML = '';
    const noBtn = document.createElement('button');
    noBtn.className = 'modal-cancel';
    noBtn.textContent = noLabel;
    noBtn.addEventListener('click', () => { closeActionModal(); onNo(); });
    const yesBtn = document.createElement('button');
    yesBtn.className = 'modal-confirm';
    yesBtn.textContent = yesLabel;
    yesBtn.addEventListener('click', () => { closeActionModal(); onYes(); });
    actionModalButtons.appendChild(noBtn);
    actionModalButtons.appendChild(yesBtn);
    actionModal.classList.add('show');
  }

  goRentBtn.addEventListener('click', () => {
    flowMode = '대여';
    resetInputFields();
    stepInputTitle.style.display = '';
    stepInputTitle.textContent = '대여 정보 입력';
    reportReasonGroup.style.display = 'none';
    basketBox.style.display = '';
    inputPhase = 'basket';
    activeField = 'basket';
    updateFieldFocus();
    showHomeStep('input');
  });

  goReturnBtn.addEventListener('click', () => {
    flowMode = '반납';
    resetInputFields();
    stepInputTitle.style.display = '';
    stepInputTitle.textContent = '반납 정보 입력';
    reportReasonGroup.style.display = 'none';
    basketBox.style.display = '';
    inputPhase = 'basket';
    activeField = 'basket';
    updateFieldFocus();
    showHomeStep('input');
  });

  goReportBtn.addEventListener('click', () => {
    flowMode = '훼손분실';
    resetInputFields();
    reportReason = '훼손';
    reportReasonRow.querySelectorAll('.periodbtn').forEach(b => b.classList.toggle('active', b.dataset.reason === reportReason));
    stepInputTitle.style.display = 'none';
    stepInputTitle.textContent = '';
    reportReasonGroup.style.display = '';
    basketBox.style.display = '';
    empLookupOpenBtn.style.display = '';
    inputPhase = 'basket';
    activeField = 'basket';
    updateFieldFocus();
    showHomeStep('input');
  });

  reportReasonRow.querySelectorAll('.periodbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      reportReason = btn.dataset.reason;
      reportReasonRow.querySelectorAll('.periodbtn').forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  inputBackBtn.addEventListener('click', () => {
    showHomeStep('buttons');
  });

  inputNextBtn.addEventListener('click', async () => {
    // ---- 대여/반납/훼손분실 신고: 장바구니 번호 직접 입력 흐름 ----
    if(flowMode === '대여' || flowMode === '반납' || flowMode === '훼손분실'){
      if(inputPhase === 'basket'){
        const basketNum = parseInt(basketDigits, 10);
        if(!Number.isInteger(basketNum) || basketNum <= 0){
          showAlert('입력 오류', '장바구니 번호를 올바르게 입력해 주세요.');
          return;
        }
        const state = await loadState();
        const basket = state.baskets.find(b => b.id === basketNum);
        if(!basket){
          showAlert('입력 오류', `존재하지 않는 장바구니 번호(${padBasket(basketNum)}번)입니다.`);
          return;
        }
        if(flowMode === '대여' && basket.status === 'rented'){
          showAlert('처리 실패', `장바구니 ${padBasket(basketNum)}번은 이미 대여 중입니다.`);
          return;
        }
        if(flowMode === '반납'){
          if(basket.status !== 'rented'){
            showAlert('처리 실패', `장바구니 ${padBasket(basketNum)}번은 대여 중이 아닙니다.`);
            return;
          }
          const renterId = basket.employeeId;
          showYesNo(
            '반납자 확인',
            `장바구니 ${padBasket(basketNum)}번은 사번 ${renterId}(으)로 대여되었습니다. 반납하시는 분이 맞습니까?`,
            '예, 맞습니다', '아니오',
            () => {
              // 예 - 대여자 본인이 반납 -> 사번 입력 없이 바로 처리
              empDigits = renterId;
              processFlow();
            },
            () => {
              // 아니오 - 다른 사람이 반납 -> 반납자 본인 사번 입력화면으로 이동
              inputPhase = 'emp';
              confirmBasketNumber(basketNum);
              empBox.style.display = '';
              activeField = 'emp';
              updateFieldFocus();
            }
          );
          return;
        }
        if(flowMode === '훼손분실'){
          if(basket.status !== 'rented'){
            showAlert('처리 실패', `장바구니 ${padBasket(basketNum)}번은 대여 중이 아니라 신고할 수 없습니다. 대여 중인 장바구니만 훼손/분실 신고가 가능합니다.`);
            return;
          }
          // 장바구니 번호(+신고유형) 확인 완료 -> 신고자 사번만 입력하는 화면으로 이동
          inputPhase = 'emp';
          reportReasonGroup.style.display = 'none';
          confirmBasketNumber(basketNum);
          empBox.style.display = '';
          empLookupOpenBtn.style.display = 'none';
          activeField = 'emp';
          updateFieldFocus();
          return;
        }
        // 대여: 장바구니 번호 확인 완료 -> 사번 입력 단계로 이동
        inputPhase = 'emp';
        confirmBasketNumber(basketNum);
        empBox.style.display = '';
        activeField = 'emp';
        updateFieldFocus();
        return;
      }
      // inputPhase === 'emp'
      if(!isValidEmpId(empDigits)){
        showAlert('입력 오류', '사번은 숫자 6자리로 입력해 주세요.');
        return;
      }
      if(flowMode === '훼손분실'){
        const basketNum = parseInt(basketDigits, 10);
        showYesNo(
          '신고 확인',
          `사번 ${empDigits}님이 장바구니 ${padBasket(basketNum)}번을 ${reportReason}(으)로 신고하시겠습니까?`,
          '예', '아니오',
          () => { proceedAfterEmpConfirmed(); },
          () => { /* 아니오 - 입력 화면에 그대로 머무름 */ }
        );
        return;
      }
      {
        const basketNum = parseInt(basketDigits, 10);
        const actionLabel = flowMode === '대여' ? '대여' : '반납';
        showYesNo(
          `${actionLabel} 확인`,
          `사번 ${empDigits}님이 장바구니 ${padBasket(basketNum)}번을 ${actionLabel}하시겠습니까?`,
          '예', '아니오',
          () => { processFlow(); },
          () => { /* 아니오 - 입력 화면에 그대로 머무름 */ }
        );
      }
      return;
    }
  });

  resultDoneBtn.addEventListener('click', () => {
    showHomeStep('buttons');
  });

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      screens.forEach(s => s.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('screen-' + t.dataset.screen).classList.add('active');
      if(t.dataset.screen === 'home'){ showHomeStep('buttons'); }
    });
  });


  renderFields();
  updateFieldFocus();
  loadState().then(render);

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
